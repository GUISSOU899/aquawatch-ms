<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AquaWatch - Login</title>
    <style>
        body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);margin:0}
        .box{background:#fff;padding:28px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);width:360px}
        h1{color:#333;font-size:20px;margin-bottom:16px}
        label{display:block;margin-top:10px;color:#555;font-weight:600}
        input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:6px}
        button{margin-top:16px;width:100%;padding:10px;border-radius:10px;border:none;background:#667eea;color:#fff;font-weight:700;cursor:pointer}
        .msg{margin-top:12px;font-size:0.9em}
        .link{margin-top:8px;text-align:center;color:#667eea}
    </style>
</head>
<body>
  <div class="box">
    <h1>🔐 Connexion AquaWatch</h1>
    <form id="loginForm">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Se connecter</button>
      <div class="msg" id="msg"></div>
      <div class="link"><small>Utilisateur demo: <strong>admin</strong> / <strong>password123</strong></small></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const j = await res.json();
        if (!res.ok || !j.success) {
          msg.style.color = 'red'; msg.textContent = j.error || 'Identifiants invalides'; return;
        }
        // store token and redirect
        localStorage.setItem('aw_token', j.token);
        location.href = '/';
      } catch (err) { msg.style.color = 'red'; msg.textContent = 'Erreur réseau'; }
    });
  </script>
</body>
</html>
